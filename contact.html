

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAB Cafe - تواصل</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ستايل البوب أب (النافذة المنبثقة) */
  .popup-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;
  }
  .popup-box {
    background: #fdf8f0; border: 3px solid #5c3d2e; border-radius: 15px;
    padding: 2rem; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  .popup-icon { font-size: 3rem; color: #5c3d2e; margin-bottom: 1rem; }
  .popup-box h2 { color: #5c3d2e; margin-bottom: 1rem; }
  .popup-box p { color: #3a2e27; margin-bottom: 1.5rem; font-size: 1.1rem; }
  .popup-btn {
    background: #5c3d2e; color: white; border: none; padding: 10px 30px;
    border-radius: 10px; font-size: 1.1rem; cursor: pointer; font-weight: bold;
  }
  .popup-btn:hover { background: #8b5e3c; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <img src="images/log.PNG" alt="Logo" class="logo-img">
  </div>
  <div id="menuToggle">
    <span></span>
    <span></span>
    <span></span>
  </div>
</header>

<!-- SIDEBAR -->
<div id="sideMenu">
  <a href="index.html">الرئيسية</a>
  <a href="products.html">منتجات</a>
  <a href="about.html">عنا</a>
  <a href="contact.html" class="active">تواصل</a>
</div>

<!-- CONTACT SECTION (تمت إضافة هذا الغلاف عشان يدفع الفوتر لتحت) -->
<div class="contact-section">
  <section class="contact-box">
    <h2>تواصل معنا إذا واجهتك أي مشكلة</h2>
    <!-- الفورم مربوط بـ FormSubmit عشان يرسل للإيميل -->
    <form id="contactForm" action="https://formsubmit.co/tmheba4@gmail.com" method="POST">
      <input type="text" id="name" name="name" placeholder="الاسم الكامل" required>
      <input type="email" id="email" name="email" placeholder="الإيميل" required>
      <input type="tel" name="phone" placeholder="رقم الهاتف" required>
      <textarea name="message" placeholder="الرسالة" rows="6" required></textarea>
      <button type="submit" id="submitBtn">إرسال</button>
    </form>
  </section>
</div>

<!-- النافذة المنبثقة (البوب أب) -->
<div class="popup-overlay" id="successPopup">
  <div class="popup-box">
    <div class="popup-icon">✓</div>
    <h2>تم الإرسال بنجاح!</h2>
    <p>شكراً لتواصلك مع WAB Cafe، سنقوم بالرد عليك في أقرب وقت.</p>
    <button class="popup-btn" onclick="closePopup()">حسناً</button>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-line">©️ 2025 WAB Cafe</div>
  <div class="footer-line">
    <a href="https://www.instagram.com/wabcafe.sa" target="_blank">Instagram</a> | 
    <a href="https://www.tiktok.com/@wabcafe.sa" target="_blank">TikTok</a> | 
    <a href="mailto:tmheba4@gmail.com">Email</a>
  </div>
</footer>

<script src="scripts.js"></script>
<script>
  // كود إرسال الفورم وإظهار البوب أب
  const form = document.getElementById('contactForm');
  const popup = document.getElementById('successPopup');
  const submitBtn = document.getElementById('submitBtn');

  if(form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault(); 
      submitBtn.textContent = 'جاري الإرسال...';
      submitBtn.disabled = true;

      const formData = new FormData(form);
      fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
      })
      .then(response => {
        popup.style.display = 'flex';
        form.reset();
        submitBtn.textContent = 'إرسال';
        submitBtn.disabled = false;
      })
      .catch(error => {
        alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
        submitBtn.textContent = 'إرسال';
        submitBtn.disabled = false;
      });
    });
  }

  function closePopup() {
    document.getElementById('successPopup').style.display = 'none';
  }
</script>
</body>
</html>
